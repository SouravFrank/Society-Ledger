name: Deploy to GitHub Pages

# Deploy the static export whenever changes land on main
# (i.e. after a PR is merged), or manually from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# The gh-pages package pushes the exported site to the gh-pages branch,
# which is the branch GitHub Pages serves from.
permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & publish static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The gh-pages package pushes from a temporary git repo, so the checkout's
      # persisted credentials must be shared globally for the push to authenticate.
      - name: Share checkout credentials globally
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git config --global http.https://github.com/.extraheader "$auth_header"

      - name: Typecheck
        run: npm run typecheck

      # Builds the static export (GITHUB_PAGES=true) and pushes out/
      # to the gh-pages branch via the npm deploy script.
      - name: Build & publish
        run: npm run deploy
